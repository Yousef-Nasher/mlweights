[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mlweights"
version = "0.1.0"
description = "Scaling and checking survey weights for two-level random-intercept models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8"]
authors = [{name = "Yousef M. Nasher"}, {name = "Marwan Alqumbaey"}]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License",
               "Topic :: Scientific/Engineering :: Mathematics"]

[project.urls]
Homepage = "https://github.com/Yousef-Nasher/mlweights"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
